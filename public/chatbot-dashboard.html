<!DOCTYPE html>
<html>
<head>
  <title>Support Inbox</title>
  <link rel="stylesheet" href="css/chatbot-admin.css">
</head>
<body>

    <div class="top-bar">
        <span id="welcomeText">Customer Support Inbox</span>
        <div class="profile-menu">
            <button id="profileMenuBtn" class="profile-menu-btn" aria-expanded="false" aria-controls="profileMenu">
                <span id="profileInitial">C</span>
            </button>
            <div id="profileMenu" class="profile-menu-panel" hidden>
                <a href="/user-dashboard">My Orders</a>
                <a id="bakerDashboardLink" href="/baker-dashboard" style="display:none;">Baker Dashboard</a>
                <a href="/templates.html">Templates</a>
                <button id="logoutBtn">Logout</button>
            </div>
        </div>
    </div>

<div class="chat-admin-container">

  <!-- LEFT: ticket list -->
  <div class="ticket-list" id="ticket-list"></div>

  <!-- RIGHT: chat view -->
  <div class="ticket-view" id="ticket-view">
    <p>Select a ticket to view conversation</p>
  </div>

</div>

<div id="tickets"></div>

<script src="js/auth.js"></script>
<script>
  (async () => {
    const user = await refreshSession(); // OR requireAuthPage()
    if (!user) window.location.href = '/login';
  })();
</script>
<script src="js/chatbot-admin.js"></script>


</body>
</html>
