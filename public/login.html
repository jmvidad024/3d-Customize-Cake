<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - 3D Cake Customizer</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>3D Cake Customizer</h1>
      <p>Login or register to continue. Pre-made templates are ready after sign in.</p>

      <div class="auth-tabs">
        <button id="loginTab" class="tab active">Login</button>
        <button id="registerTab" class="tab">Register</button>
      </div>

      <form id="loginForm" class="auth-form active">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit" id="loginButton">Login</button>
      </form>

      <form id="registerForm" class="auth-form">
        <input type="text" id="registerName" placeholder="Full Name" required />
        <input type="email" id="registerEmail" placeholder="Email" required />
        <input type="password" id="registerPassword" placeholder="Password" required />
        <button type="submit" id="registerButton">Register</button>
      </form>

      <div class="auth-footer">
        Visit our socials:<br>
        <i class="fa fa-facebook"></i> <a href="https://www.facebook.com/john.martin.vidad.2025" target="_blank">@john.martin.vidad.2025</a><br>
        <i class="fa fa-instagram"></i> <a href="https://www.instagram.com/jm.vidad024?igsh=MTE2cjI3YmJ0c2I5MA==" target="_blank">@jm.vidad024</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
