<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - 3D Cake Customizer</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <span>Cake Studio</span>
        <h1>3D Cake Customizer</h1>
        <p>Sign in to design cakes, browse templates, and manage your orders.</p>
      </div>

      <div class="auth-tabs">
        <button id="loginTab" class="tab active">Login</button>
        <button id="registerTab" class="tab">Register</button>
      </div>

      <form id="loginForm" class="auth-form active">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit" id="loginButton">Login</button>
      </form>

      <form id="registerForm" class="auth-form">
        <input type="text" id="registerName" placeholder="Full Name" required />
        <input type="email" id="registerEmail" placeholder="Email" required />
        <input type="password" id="registerPassword" placeholder="Password" required />
        <button type="submit" id="registerButton">Register</button>
      </form>

      <div class="auth-footer">
        <span>Follow Cake Studio</span>
        <div class="auth-socials">
          <a href="https://www.facebook.com/john.martin.vidad.2025" target="_blank">Facebook</a>
          <a href="https://www.instagram.com/jm.vidad024?igsh=MTE2cjI3YmJ0c2I5MA==" target="_blank">Instagram</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
