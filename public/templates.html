<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Cake Templates - 3D Cake Customizer</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/templates.css">
    <link rel="stylesheet" href="/css/chatbot-widget.css">
</head>
<body>
    <nav class="app-navbar">
        <div class="app-navbar-brand">
            <strong>Cake Studio</strong>
            <span id="welcomeText">Template gallery</span>
        </div>
        <div class="profile-menu">
            <button id="profileMenuBtn" class="profile-menu-btn" aria-expanded="false" aria-controls="profileMenu">
                <span id="profileInitial">C</span>
            </button>
            <div id="profileMenu" class="profile-menu-panel" hidden>
                <a class="customer-only" id="userDashboardLink" href="/user-dashboard">My Orders</a>
                <a class="customer-only" href="/help-report">Help & Report</a>
                <a class="customer-only" href="/custom-request">Request Custom Design</a>
                <a class="admin-only" id="bakerDashboardLink" href="/baker-dashboard" style="display:none;">Baker Dashboard</a>
                <a class="admin-only" id="chatbotDashboardLink" href="/report-dashboard" style="display:none;">Report Tickets</a>
                <a class="admin-only" href="/?templateMode=1" style="display:none;">Create Template</a>
                <a href="/templates">Templates</a>
                <a href="/">Editor</a>
                <button id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Choose Your Perfect Cake</h1>
            <p>Browse our delicious pre-made designs or create your custom masterpiece</p>
        </div>

        <div class="controls">
            <button class="create-custom-btn" id="createCustomBtn">Create Custom Cake</button>
        </div>

        <div id="draftNotice" class="draft-notice"></div>

        <div id="templatesContainer" class="templates-grid">
            <div class="loading">Loading templates...</div>
        </div>
    </div>

    <div id="chatbot-widget">
        <button id="chatbot-toggle">💬</button>

        <div id="chatbot-box" class="hidden">
            <div class="chat-header">Cake Studio Support</div>

            <div id="chat-messages"></div>

            <textarea id="chat-input" placeholder="Ask me about pricing, delivery, flavors..."></textarea>

            <button id="chat-send">Send</button>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/three.min.js"></script>
    <script src="/js/cake-thumbnail.js"></script>
    <script src="/js/templates.js"></script>
    <script src="/js/chatbot-widget.js"></script>
</body>
</html>
